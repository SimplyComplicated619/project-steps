name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # to publish each build's APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK (platform 36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        id: build
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        id: tests
        if: always()
        continue-on-error: true
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"UNIT TESTS: {t} run, {f} failures, {e} errors, {s} skipped")
          PY

      - name: Lint
        id: lint
        if: always()
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: APK size and SHA-256
        if: steps.build.outcome == 'success'
        run: |
          cd app/build/outputs/apk/debug
          ls -l app-debug.apk
          sha256sum app-debug.apk | tee app-debug.apk.sha256
          keytool -printcert -jarfile app-debug.apk | grep -E "SHA256:|Owner" || true

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Publish APK as a release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          SHA=$(cut -d' ' -f1 app/build/outputs/apk/debug/app-debug.apk.sha256)
          cp app/build/outputs/apk/debug/app-debug.apk "ProjectSteps-${TAG}-debug.apk"
          gh release create "$TAG" "ProjectSteps-${TAG}-debug.apk" app/build/outputs/apk/debug/app-debug.apk.sha256 \
            --prerelease --target "${{ github.sha }}" --title "Project Steps debug ${TAG}" \
            --notes "Debug APK from commit ${{ github.sha }}. SHA-256: ${SHA}. Unit tests: ${{ steps.tests.outcome }}. Lint: ${{ steps.lint.outcome }}."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/schemas/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Build (assembleDebug) | ${{ steps.build.outcome }} |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.build.outcome }}" = "success" && test "${{ steps.tests.outcome }}" = "success" && test "${{ steps.lint.outcome }}" = "success"
